# Render blueprint for the FastAPI backend.
# Create the Postgres database on Neon first, then paste its URL into DATABASE_URL
# in the Render dashboard (it is marked sync:false so it is never committed here).
services:
  - type: web
    name: bput-career-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6

      # --- Database (Neon) ---
      # Must use the asyncpg driver: postgresql+asyncpg://user:pass@host/db
      - key: DATABASE_URL
        sync: false

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

      # --- AI: Groq in production, since Render cannot reach a local Ollama ---
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # --- OAuth 2.0 ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

      # --- Public URLs (set both after the first deploy gives you the hostnames) ---
      - key: BACKEND_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
